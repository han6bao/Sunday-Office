<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Sunday Office OG card: deep navy field, gold sun, hairline grid -->
  <defs>
    <pattern id="hair" width="1" height="6" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="rgba(243,237,226,0.05)"/>
    </pattern>
    <linearGradient id="grain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1e33"/>
      <stop offset="1" stop-color="#16293f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grain)"/>
  <rect width="1200" height="630" fill="url(#hair)"/>
  <rect x="60" y="60" width="1080" height="510" fill="none" stroke="rgba(243,237,226,0.25)"/>
  <!-- sun -->
  <g fill="#c8a062" transform="translate(110,120)">
    <circle cx="0" cy="0" r="16"/>
    <g opacity="0.95">
      <rect x="-3" y="-34" width="6" height="20" rx="3"/>
      <rect x="-3" y="14" width="6" height="20" rx="3"/>
      <rect x="-34" y="-3" width="20" height="6" rx="3"/>
      <rect x="14" y="-3" width="20" height="6" rx="3"/>
      <rect x="-26" y="-26" width="18" height="6" rx="3" transform="rotate(45 0 0)"/>
      <rect x="8" y="-26" width="18" height="6" rx="3" transform="rotate(-45 0 0)"/>
      <rect x="-26" y="20" width="18" height="6" rx="3" transform="rotate(-45 0 0)"/>
      <rect x="8" y="20" width="18" height="6" rx="3" transform="rotate(45 0 0)"/>
    </g>
  </g>
  <text x="150" y="196" font-family="Georgia,'Times New Roman',serif" font-size="96" letter-spacing="2" fill="#f3ede2">SUNDAY OFFICE</text>
  <text x="154" y="246" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="34" fill="#c8a062">Photography-led creative work</text>
  <text x="154" y="286" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="30" fill="#f3ede2">for people with something worth seeing.</text>
  <text x="154" y="346" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="6" fill="#f3ede2">INDEPENDENT CREATIVE AGENCY</text>
  <line x1="154" y1="368" x2="440" y2="368" stroke="rgba(243,237,226,0.6)"/>
  <text x="154" y="400" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="4" fill="#f3ede2">SEATTLE / TACOMA + BEYOND</text>
  <!-- right: blessing stamp -->
  <g transform="translate(1020,210)">
    <circle r="92" fill="none" stroke="#b23a2e" stroke-width="5" opacity="0.92"/>
    <circle r="78" fill="none" stroke="#b23a2e" stroke-width="1.5" opacity="0.55"/>
    <text x="0" y="-28" text-anchor="middle" font-size="52" font-family="'KaiTi','STKaiti',serif" fill="#b23a2e">福</text>
    <text x="0" y="22" text-anchor="middle" font-size="52" font-family="'KaiTi','STKaiti',serif" fill="#b23a2e">祿</text>
    <text x="0" y="72" text-anchor="middle" font-size="52" font-family="'KaiTi','STKaiti',serif" fill="#b23a2e">壽</text>
  </g>
</svg>